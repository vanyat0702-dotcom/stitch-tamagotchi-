<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch & Angel Tamagotchi</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=7"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121826; color: #fff; padding: 15px; text-align: center; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .monster-avatar { width: 130px; height: 130px; border-radius: 50%; border: 4px solid #38bdf8; margin: 15px auto; display: flex; align-items: center; justify-content: center; font-size: 50px; background: #334155; }
        .bar-container { background: #334155; border-radius: 10px; height: 18px; margin: 8px 0; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; transition: width 0.3s ease; }
        .bg-hunger { background: #ef4444; }
        .bg-energy { background: #eab308; }
        .bg-happy { background: #ec4899; }
        .bar-text { position: absolute; width: 100%; top: 0; left: 0; font-size: 11px; font-weight: bold; line-height: 18px; text-shadow: 1px 1px 2px #000; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:active { transform: scale(0.95); }
        .partner-card { border: 2px dashed #ec4899; }
        .hidden { display: none; }
        .selection-row { display: flex; justify-content: space-around; gap: 15px; margin-top: 20px; }
        .option-box { cursor: pointer; padding: 10px; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="selection-screen" class="card">
        <h2>Выбери персонажа!</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 10px;">Игра для двоих</p>
        <div class="selection-row">
            <div class="option-box" onclick="selectCharacter('stitch')">
                <div class="monster-avatar">👽</div>
                <h3 style="margin-top: 8px; color: #38bdf8;">Стич ⚡</h3>
            </div>
            <div class="option-box" onclick="selectCharacter('angel')">
                <div class="monster-avatar" style="border-color:#ec4899;">🌸</div>
                <h3 style="margin-top: 8px; color: #ec4899;">Ангел 💕</h3>
            </div>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <h2 id="char-name">Монстрик</h2>
            <p id="char-level" style="color: #38bdf8; margin-top: 5px;">Уровень 1</p>
            <div id="char-emoji" class="monster-avatar">👽</div>

            <div class="bar-container">
                <div id="hunger-bar" class="bar-fill bg-hunger" style="width: 100%;"></div>
                <div id="hunger-text" class="bar-text">Сытость: 100%</div>
            </div>
            <div class="bar-container">
                <div id="energy-bar" class="bar-fill bg-energy" style="width: 100%;"></div>
                <div id="energy-text" class="bar-text">Бодрость: 100%</div>
            </div>
            <div class="bar-container">
                <div id="happy-bar" class="bar-fill bg-happy" style="width: 100%;"></div>
                <div id="happy-text" class="bar-text">Счастье: 100%</div>
            </div>

            <div class="btn-grid">
                <button onclick="doAction('feed')">🍖 Еда</button>
                <button onclick="doAction('play')">🎮 Игры</button>
                <button onclick="doAction('sleep')">😴 Сон</button>
            </div>
        </div>

        <div class="card partner-card">
            <h3>Профиль Партнера 💕</h3>
            <div id="partner-info" style="margin-top: 10px; color: #cbd5e1;">Загрузка...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const tgUser = tg.initDataUnsafe?.user || { id: "123456", first_name: "Брат" };

        async function init() {
            try {
                const res = await fetch(`/api/player/${tgUser.id}`);
                const data = await res.json();
                if (data.registered) {
                    showGame(data.data);
                    loadPartner();
                } else {
                    document.getElementById('selection-screen').classList.remove('hidden');
                }
            } catch (e) { console.error(e); }
        }

        async function selectCharacter(char) {
            await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: tgUser.id, username: tgUser.first_name, character: char })
            });
            location.reload();
        }

        function showGame(player) {
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            const isStitch = player.character === 'stitch';
            document.getElementById('char-name').innerText = isStitch ? 'Стич ⚡' : 'Ангел 💕';
            const avatar = document.getElementById('char-emoji');
            avatar.innerText = isStitch ? '👽' : '🌸';
            if (!isStitch) {
                avatar.style.borderColor = '#ec4899';
            }
            document.getElementById('char-level').innerText = `Уровень ${player.level} (${player.xp} XP)`;
            updateStats(player);
        }

        function updateStats(p) {
            document.getElementById('hunger-bar').style.width = p.hunger + '%';
            document.getElementById('hunger-text').innerText = `Сытость: ${p.hunger}%`;
            document.getElementById('energy-bar').style.width = p.energy + '%';
            document.getElementById('energy-text').innerText = `Бодрость: ${p.energy}%`;
            document.getElementById('happy-bar').style.width = p.happiness + '%';
            document.getElementById('happy-text').innerText = `Счастье: ${p.happiness}%`;
        }

        async function doAction(action) {
            const res = await fetch('/api/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: tgUser.id, action })
            });
            const data = await res.json();
            updateStats(data);
        }

        async function loadPartner() {
            const res = await fetch(`/api/partner/${tgUser.id}`);
            const data = await res.json();
            const pDiv = document.getElementById('partner-info');
            if (data.partner) {
                const p = data.partner;
                pDiv.innerHTML = `<p>${p.username} (${p.character === 'stitch' ? 'Стич ⚡' : 'Ангел 💕'}) — Ур. ${p.level}</p>`;
            } else {
                pDiv.innerText = 'Вторая половинка еще не зашла!';
            }
        }

        init();
    </script>
</body>
</html>
